apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rust-processor
  namespace: telemetry-demo
  labels: {app: rust-processor, lifecycle: production-follow-up}
spec:
  podSelector:
    matchLabels: {app: rust-processor}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 9100, protocol: TCP}]
  egress:
    - ports: [{port: 9092, protocol: TCP}, {port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
