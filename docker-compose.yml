# SYNTHETIC DEMO. Single-broker Kafka 3.7 (KRaft, no ZooKeeper) for local runs only.
# Replication factor 1 everywhere: no broker-failure tolerance is claimed.
name: telemetry-migration-demo

services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: tmd-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: c3ludGhldGljLWRlbW8tMQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # --- Service stubs (opt-in profiles). The evidence runs in docs/EVIDENCE.md run these components
  # --- as host processes via scripts/; the containers are the packaging path.
  generator:
    profiles: ["stubs"]
    build: { context: ., dockerfile: generator/Dockerfile }
    depends_on: { kafka: { condition: service_healthy } }
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    command: ["--seed", "42", "--events", "10000"]

  rust-processor:
    profiles: ["stubs"]
    build: { context: rust-processor }
    depends_on: { kafka: { condition: service_healthy } }
    env_file: [.env]          # supplies LOCATION_ENC_KEY; the processor refuses to start without it
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      PROCESSOR_INSTANCE_ID: compose-0
    ports: ["9100:9100"]

  legacy-spark:
    profiles: ["stubs"]
    build: { context: legacy }
    depends_on: { kafka: { condition: service_healthy } }
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
