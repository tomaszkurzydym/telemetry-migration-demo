[package]
name = "telemetry-processor"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "SYNTHETIC DEMO: battery telemetry validation/normalization Kafka stream processor"

[lib]
name = "telemetry_processor"
path = "src/lib.rs"

[[bin]]
name = "telemetry-processor"
path = "src/main.rs"

[dependencies]
# Pinned exactly: crypto and Kafka client are security/correctness critical.
aes-gcm = { version = "=0.10.3", features = ["std"] }
rdkafka = { version = "=0.38.0", default-features = false, features = ["libz"] }
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
rust_decimal = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
prometheus = { version = "=0.13.4", default-features = false }
rand = "=0.8.5"
log = "0.4"
env_logger = "0.11"
signal-hook = "0.3"
regex = "1"

[dev-dependencies]
